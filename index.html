        /* ==========================================
   REAL QR TRACKING BOX
   ========================================== */
#qr-tracking-box {
    position: absolute;
    left: 0;
    top: 0;
    width: 0;
    height: 0;

    border: 3px solid #22c55e;
    border-radius: 10px;

    pointer-events: none;
    z-index: 8;

    opacity: 0;
    transform: translate3d(0, 0, 0);

    transition:
        left 0.12s ease-out,
        top 0.12s ease-out,
        width 0.12s ease-out,
        height 0.12s ease-out,
        opacity 0.15s ease;
}

#qr-tracking-box.active {
    opacity: 1;
}

#qr-tracking-box::after {
    content: "QR DETECTED";

    position: absolute;
    left: 0;
    top: -28px;

    background: #22c55e;
    color: white;

    font-size: 11px;
    font-weight: 600;

    padding: 3px 7px;
    border-radius: 5px;

    white-space: nowrap;
}
        .scanner-corner {

    <script>
        // GOOGLE APPS SCRIPT WEB APP URL (ใส่ URL ตรงนี้โดยไม่ต้องรอกดเชื่อมต่อ)
        let WEB_APP_URL = localStorage.getItem('ams_script_url') || 'https://script.google.com/macros/s/AKfycbzXgFiJWsDft8DL7MZia3hlM3pBC0_rVYHhKL-dA2-fX1sCpwNki7NoD2lRbnfxUDriSg/exec';

// ==========================================
// PART MASTER CACHE
// ==========================================
let partMasterCache = {};
let partMasterLoaded = false;
// ==========================================
// FIND UNIT FROM LOCAL PART MASTER CACHE
// ==========================================
function findPartUnit(partNumber) {

    const searchPart = String(partNumber || '')
        .trim()
        .toLowerCase();

    if (!searchPart) return '';

    if (
        Object.prototype.hasOwnProperty.call(
            partMasterCache,
            searchPart
        )
    ) {
        return String(
            partMasterCache[searchPart] || ''
        ).trim();
    }

    const cacheKey = Object.keys(partMasterCache)
        .find(key =>
            String(key)
                .trim()
                .toLowerCase() === searchPart
        );

    if (cacheKey) {
        return String(
            partMasterCache[cacheKey] || ''
        ).trim();
    }

    return '';
}

const PART_MASTER_CACHE_KEY = 'ams_part_master';
const PART_MASTER_CACHE_TIME_KEY = 'ams_part_master_time';

// Cache อายุ 1 ชั่วโมง
const PART_MASTER_CACHE_DURATION = 5 * 60 * 1000;

try {
    const savedPartMaster =
        localStorage.getItem(PART_MASTER_CACHE_KEY);

    const savedTime =
        localStorage.getItem(PART_MASTER_CACHE_TIME_KEY);

    const cacheAge =
        Date.now() - Number(savedTime || 0);

    if (
        savedPartMaster &&
        savedTime &&
        cacheAge < PART_MASTER_CACHE_DURATION
    ) {
        partMasterCache = JSON.parse(savedPartMaster);
        partMasterLoaded = true;

        console.log(
            'Part Master loaded from localStorage:',
            Object.keys(partMasterCache).length,
            'parts'
        );
    } else {
        // Cache หมดอายุ
        localStorage.removeItem(PART_MASTER_CACHE_KEY);
        localStorage.removeItem(PART_MASTER_CACHE_TIME_KEY);

        console.log('Part Master cache expired');
    }

} catch (error) {
    console.error(
        'PART MASTER LOCAL CACHE ERROR:',
        error
    );

    partMasterCache = {};
    partMasterLoaded = false;
}
        
// ==========================================
// LOAD PART MASTER ONCE
// ==========================================
async function loadPartMaster() {
    if (partMasterLoaded) return;

    try {
        const response = await fetch(WEB_APP_URL, {
            method: 'POST',
            body: new URLSearchParams({
                data: JSON.stringify({
                    action: 'loadPartMaster'
                })
            })
        });

        const result = await response.json();

        if (result.status === 'success') {
            partMasterCache = result.data || {};
            partMasterLoaded = true;

            // เก็บ Part Master ไว้ในเครื่อง
            try {
                localStorage.setItem(
    PART_MASTER_CACHE_KEY,
    JSON.stringify(partMasterCache)
);

localStorage.setItem(
    PART_MASTER_CACHE_TIME_KEY,
    Date.now().toString()
);
            } catch (error) {
                console.warn(
                    'ไม่สามารถบันทึก Part Master ลงเครื่องได้:',
                    error
                );
            }

            console.log(
                'Part Master loaded:',
                Object.keys(partMasterCache).length,
                'parts'
            );
            console.log(
    'PART MASTER SAMPLE:',
    Object.entries(partMasterCache).slice(0, 5)
);

        } else {
            console.error(
                'LOAD PART MASTER ERROR:',
                result.message
            );
        }

    } catch (error) {
        console.error(
            'LOAD PART MASTER CONNECTION ERROR:',
            error
        );
    }
}
        const MOCK_ZONES = {
            "ZONE_A": ["A1-1", "A1-2", "A1-3"],
            "ZONE_B": ["B1-1", "B1-2", "B1-3"],
            "ZONE_C": ["C1-1", "C1-2", "C1-3"],
            "ZONE_D": ["D1-1", "D1-2", "D1-3", "D1-4"]
        };

        let currentSession = { zone: "", location: "", responsiblePerson: "" };
        let currentScanData = { partNumber: "", qrQty: "", unit: "", lotNumber: "", serialNumber: "", unit2: "" };

    // โหลด Part Master ล่วงหน้า
    if (WEB_APP_URL && !WEB_APP_URL.includes('YOUR_')) {

    }

    // ตรวจสอบ Part Master Cache
    setTimeout(() => {
        console.log(
            'PART MASTER CACHE:',
            Object.keys(partMasterCache).length,
            'parts'
        );
    }, 1000);
});

        function updateLocations() {
            const zoneSelect = document.getElementById('zone-select');
            const locationSelect = document.getElementById('location-select');
            const selectedZone = zoneSelect.value;
            locationSelect.innerHTML = '<option value="" disabled selected>-- เลือกพื้นที่ปฏิบัติงาน --</option>';
            if (selectedZone && MOCK_ZONES[selectedZone]) {
                MOCK_ZONES[selectedZone].forEach(loc => {
                    const option = document.createElement('option');
                    option.value = loc;
                    option.textContent = loc;
                    locationSelect.appendChild(option);
                });
                locationSelect.disabled = false;
            } else {
                locationSelect.disabled = true;
            }
        }

        async function goToScanner() {

                openSettingsModal(true);
                return;
            }

    // ==========================================
    // LOAD PART MASTER ก่อนเริ่มสแกน

    if (!partMasterLoaded) {
        await loadPartMaster();
    }

            const zone = document.getElementById('zone-select').value;
            const loc = document.getElementById('location-select').value;
            const resp = document.getElementById('responsible-name').value.trim();

            if (!zone || !loc || !resp) {
                Swal.fire({ icon: 'warning', title: 'ข้อมูลไม่ครบถ้วน', text: 'กรุณากรอกข้อมูลผู้ตรวจนับให้ครบถ้วนก่อนเริ่มสแกน', confirmButtonColor: '#3085d6' });
                return;
            }

            currentSession.zone = zone;

            currentSession.responsiblePerson = resp;

            showView('view-scanner');
            setTimeout(() => { initScanner(); }, 150);

        // ==========================================
// ZXING CAMERA SCANNER
// OPTIMIZED FOR FAST + RELIABLE QR / BARCODE
// ==========================================

// ==========================================
// ZXING SCANNER - HIGH PERFORMANCE
// ไม่กระทบส่วนอื่น
// ==========================================

let zxingCodeReader = null;
let availableCameras = [];
let currentCameraIndex = 0;
let selectedDeviceId = null;
let currentVideoTrack = null;
let torchEnabled = false;
let scanLocked = false;


// ==========================================
// INIT SCANNER
// ==========================================
async function initScanner() {

    const errorBox =
        document.getElementById("camera-error");

    errorBox.classList.add("hidden");

    scanLocked = false;
    torchEnabled = false;

    updateTorchButton(false);

    // ปิดกล้องเก่าก่อน
    await stopZXingScanner();

    // ==========================================
    // CREATE ZXING READER
    // ==========================================
    if (!zxingCodeReader) {

        const hints = new Map();

        // บังคับให้ ZXing พยายามอ่านให้เต็มที่
        hints.set(
            ZXing.DecodeHintType.TRY_HARDER,
            true
        );

        // รองรับ QR + Barcode หลัก ๆ
        hints.set(
            ZXing.DecodeHintType.POSSIBLE_FORMATS,
            [
                ZXing.BarcodeFormat.QR_CODE,

                ZXing.BarcodeFormat.CODE_128,
                ZXing.BarcodeFormat.CODE_39,
                ZXing.BarcodeFormat.CODE_93,

                ZXing.BarcodeFormat.EAN_13,
                ZXing.BarcodeFormat.EAN_8,

                ZXing.BarcodeFormat.UPC_A,
                ZXing.BarcodeFormat.UPC_E,

                ZXing.BarcodeFormat.ITF,

                ZXing.BarcodeFormat.DATA_MATRIX,

async function applyAutoZoom(track) {

        // ==========================================
// AUTO QR DETECTION + SMOOTH ZOOM
// ==========================================

let barcodeDetector = null;
let autoZoomRunning = false;
let autoZoomAnimation = null;
        
// ==========================================
// AUTO ZOOM STABILITY
// ==========================================
        
let lastZoomTime = 0;
        
const ZOOM_INTERVAL = 180;     // ปรับ Zoom ไม่ถี่เกินไป
const ZOOM_DEAD_ZONE = 0.03;   // ต่างเล็กน้อยไม่ต้องปรับ

// ==========================================
// INIT BARCODE DETECTOR
// ==========================================
function initBarcodeDetector() {

    // Browser ไม่รองรับ
    if (
        typeof BarcodeDetector === "undefined"
    ) {

        console.log(
            "BarcodeDetector: NOT SUPPORTED"
        );

        return false;
    }

    try {

        barcodeDetector =
            new BarcodeDetector({

                formats: [
                    "qr_code",
                    "code_128",
                    "code_39",
                    "code_93",
                    "ean_13",
                    "ean_8",
                    "itf"
                ]

            });

        console.log(
            "BarcodeDetector: READY"
        );

        return true;

    } catch (error) {

        console.log(
            "BarcodeDetector INIT ERROR:",
            error
        );

        barcodeDetector = null;

        return false;
    }
}


// ==========================================
// START AUTO QR DETECTION
// ==========================================
function startAutoQRDetection() {

    if (!currentVideoTrack) {
        return;
    }

    if (!barcodeDetector) {

        if (!initBarcodeDetector()) {
            return;
        }
    }

    if (autoZoomRunning) {
        return;
    }

    autoZoomRunning = true;

    console.log(
        "AUTO QR DETECTION: START"
    );

    detectQRPosition();

}


// ==========================================
// STOP AUTO QR DETECTION
// ==========================================
function stopAutoQRDetection() {

    autoZoomRunning = false;

    if (autoZoomAnimation) {

        cancelAnimationFrame(
            autoZoomAnimation
        );

        autoZoomAnimation = null;
    }

}

// ==========================================
// SHOW QR TRACKING BOX
// ==========================================
function updateQRTrackingBox(box, video) {

    const trackingBox =
        document.getElementById(
            "qr-tracking-box"
        );

    if (
        !trackingBox ||
        !box ||
        !video
    ) {
        return;
    }

    if (
        !video.videoWidth ||
        !video.videoHeight
    ) {
        return;
    }

    const reader =
        document.getElementById(
            "reader"
        );

    if (!reader) {
        return;
    }

    // ==========================================
    // VIDEO → READER SCALE
    // ==========================================

    const scaleX =
        reader.clientWidth /
        video.videoWidth;

    const scaleY =
        reader.clientHeight /
        video.videoHeight;

    // ==========================================
    // POSITION
    // ==========================================

    const left =
        box.x * scaleX;

    const top =
        box.y * scaleY;

    const width =
        box.width * scaleX;

    const height =
        box.height * scaleY;

    // ==========================================
    // UPDATE BOX
    // ==========================================

    trackingBox.style.left =
        `${left}px`;

    trackingBox.style.top =
        `${top}px`;

    trackingBox.style.width =
        `${width}px`;

    trackingBox.style.height =
        `${height}px`;

    trackingBox.classList.add(
        "active"
    );
}

// ==========================================
// HIDE QR TRACKING BOX
// ==========================================
function hideQRTrackingBox() {

    const trackingBox =
        document.getElementById(
            "qr-tracking-box"
        );

    if (!trackingBox) {
        return;
    }

    trackingBox.classList.remove(
        "active"
    );
}

// ==========================================
// DETECT QR POSITION
// ==========================================
async function detectQRPosition() {

    if (!autoZoomRunning) {
        return;
    }

    const video =
        document.getElementById(
            "zxing-video"
        );

    if (
        !video ||
        video.readyState <
            HTMLMediaElement.HAVE_CURRENT_DATA
    ) {

        autoZoomAnimation =
            requestAnimationFrame(
                detectQRPosition
            );

        return;
    }

    try {

        const detected =
            await barcodeDetector.detect(
                video
            );

        if (
    detected &&
    detected.length > 0
) {

    const barcode =
        detected[0];

    if (
        barcode.boundingBox
    ) {

        // ==========================================
        // แสดงกรอบรอบ QR จริง
        // ==========================================
        updateQRTrackingBox(
            barcode.boundingBox,
            video
        );

        // ==========================================
        // AUTO ZOOM
        // ==========================================
        await adjustZoomToBarcode(
            barcode.boundingBox,
            video
        );
    }

} else {

    // ไม่เจอ QR → ซ่อนกรอบ
    hideQRTrackingBox();
}

    } catch (error) {

        // ไม่ต้องแสดง error ทุก frame
        // เพราะบาง browser detect frame ไม่ทัน
    }

    // ตรวจซ้ำประมาณทุก frame
    autoZoomAnimation =
        requestAnimationFrame(
            detectQRPosition
        );
}

// ==========================================
// SMOOTH AUTO ZOOM
// ==========================================
async function adjustZoomToBarcode(
    box,
    video
) {

    if (!currentVideoTrack) {
        return;
    }

    const capabilities =
        currentVideoTrack.getCapabilities
            ? currentVideoTrack.getCapabilities()
            : {};

    if (!capabilities.zoom) {
        return;
    }

    const minZoom =
        Number(
            capabilities.zoom.min
        );

    const maxZoom =
        Number(
            capabilities.zoom.max
        );

    if (
        !isFinite(minZoom) ||
        !isFinite(maxZoom)
    ) {
        return;
    }

    if (
        !video.videoWidth ||
        !video.videoHeight
    ) {
        return;
    }

    // ==========================================
    // QR SIZE RELATIVE TO VIDEO
    // ==========================================

    const qrWidth =
        box.width /
        video.videoWidth;

    const qrHeight =
        box.height /
        video.videoHeight;

    const qrSize =
        Math.max(
            qrWidth,
            qrHeight
        );

    // ==========================================
    // TARGET ZOOM
    // ==========================================

    let targetZoom;

    if (qrSize < 0.12) {

        // QR เล็กมาก → ขยาย
        targetZoom = 2.0;

    } else if (qrSize < 0.20) {

        // QR ยังเล็ก → ขยายปานกลาง
        targetZoom = 1.6;

    } else if (qrSize < 0.30) {

        // กำลังดี
        targetZoom = 1.25;

    } else {

        // ใหญ่พอแล้ว
        targetZoom = 1.0;

    }

    targetZoom =
        Math.max(
            minZoom,
            Math.min(
                targetZoom,
                maxZoom
            )
        );

    // ==========================================
    // CURRENT ZOOM
    // ==========================================

    const settings =
        currentVideoTrack.getSettings
            ? currentVideoTrack.getSettings()
            : {};

    const currentZoom =
        Number(
            settings.zoom || minZoom
        );

    if (
        !isFinite(currentZoom)
    ) {
        return;
    }

// ==========================================
// DEAD ZONE
// ถ้าต่างกันนิดเดียว ไม่ต้องปรับ
// ==========================================
const difference =
    targetZoom -
    currentZoom;

if (
    Math.abs(difference) <
    ZOOM_DEAD_ZONE
) {
    return;
}

// ==========================================
// LIMIT ZOOM FREQUENCY
// ไม่ให้ applyConstraints ถี่เกินไป
// ==========================================
const now =
    performance.now();

if (
    now - lastZoomTime <
    ZOOM_INTERVAL
) {
    return;
}

lastZoomTime =
    now;

// ==========================================
// SMOOTH ZOOM
// ==========================================
const smoothZoom =
    currentZoom +
    (
        difference * 0.12
    );

    try {

        await currentVideoTrack
            .applyConstraints({

                advanced: [
                    {
                        zoom:
                            smoothZoom
                    }
                ]

            });

    } catch (error) {

        // บางเครื่องไม่รองรับ dynamic zoom
    }

}

// ==========================================
async function stopZXingScanner() {

    scanLocked = true;

    torchEnabled = false;

    stopAutoQRDetection();

    try {

        if (
            zxingCodeReader
        ) {

            zxingCodeReader.reset();

        );


    if (
        video &&

                            track.stop();

                    }
                );

        } catch (error) {

            console.log(
                "STOP TRACK ERROR:",
                error
            );
        }


        video.srcObject =

    currentVideoTrack =

        async function processScannedData(text) {
    const parts = text.split(',').map(x => x.trim());
console.log('========== RAW SCAN ==========');
console.log('RAW TEXT:', JSON.stringify(text));
console.log('PARTS:', parts);
console.log('==============================');

    if (parts.length < 4) {
        Swal.fire({
            icon: 'error',
            title: 'รูปแบบไม่ถูกต้อง',
            text: 'ข้อมูล QR / Barcode ไม่ถูกต้อง',
            confirmButtonText: 'สแกนใหม่'
        }).then(() => {
            scanLocked = false;
            initScanner();
        });
        return;
    }

    let lotNumber = "";
    let qrType = "";

    for (let i = 0; i < parts.length; i++) {
        const value = parts[i];

        if (/^WO2([-_]|$)/i.test(value)) {
            lotNumber = value;
            qrType = "WO2";
            break;
        }

        if (/^(WO|CCO)([-_]|$)/i.test(value)) {
            lotNumber = value;
            qrType = "WO";
            break;
        }

        if (/^RC([-_]|$)/i.test(value)) {
            lotNumber = value;
            qrType = "RC";
            break;
        }
    }

    if (!lotNumber) {
        Swal.fire({
            icon: 'warning',
            title: 'ไม่พบ WO / WO2 / RC',
            text: 'ไม่พบหมายเลข WO, WO2 หรือ RC ใน QR Code นี้',
            confirmButtonText: 'สแกนใหม่'
        }).then(() => {
            scanLocked = false;
            initScanner();
        });
        return;
    }

    // ==========================================
    // BASIC QR DATA
    // ==========================================

    currentScanData.lotNumber = lotNumber;
    currentScanData.partNumber = parts[0] || '';

    // ==========================================
    // QR QTY
    // WO / WO2 = ช่องที่ 2
    // RC       = ช่องที่ 5
    // ==========================================

    if (qrType === 'RC') {
        currentScanData.qrQty = parts[4] || '';
    } else {
        currentScanData.qrQty = parts[1] || '';
    }

    currentScanData.unit = parts[2] || '';
    currentScanData.serialNumber = parts[parts.length - 1] || '';
    currentScanData.unit2 = '';

    // ==========================================
    // DISPLAY BASIC DATA
    // ==========================================

    document.getElementById('display-lot').textContent = lotNumber;
    document.getElementById('display-part').textContent =
        currentScanData.partNumber;

    const rcUnitDisplay =
        document.getElementById('rc-unit-display');

    const unit2Container =
        document.getElementById('unit2-container');

    // ==========================================
    // RC
    // ==========================================

    if (qrType === 'RC') {
    rcUnitDisplay.classList.remove('hidden');
    unit2Container.classList.remove('hidden');

    // ==========================================
    // GET UNIT FROM LOCAL PART MASTER CACHE
    // ==========================================
    const searchPart = String(
    currentScanData.partNumber || ''
).trim();

const masterUnit = findPartUnit(searchPart);
        
console.log('TEST PART:', searchPart);
console.log('TEST CACHE VALUE:', partMasterCache[searchPart]);

const matchedKey = Object.keys(partMasterCache).find(
    key =>
        String(key).trim().toLowerCase() ===
        searchPart.toLowerCase()
);

console.log('TEST MATCHED KEY:', matchedKey);
console.log(
    'TEST MATCHED UNIT:',
    matchedKey ? partMasterCache[matchedKey] : 'NOT FOUND'
);

console.log('========== RC PART MASTER CHECK ==========');
console.log('QR Part Number:', currentScanData.partNumber);
console.log('Search Part:', searchPart);
console.log('Found Unit:', masterUnit);
console.log('==========================================');

if (masterUnit) {
    currentScanData.unit = masterUnit;
    document.getElementById('display-unit').textContent = masterUnit;
} else {
    currentScanData.unit = '';
    document.getElementById('display-unit').textContent = 'ไม่พบ Unit';
}

    // แสดงหน้า Input ทันที
    showView('view-input');

    setTimeout(() => {
        document.getElementById('actual-qty').focus();
    }, 300);

    return;
}

    // ==========================================
    // WO / WO2
    // ==========================================

    rcUnitDisplay.classList.add('hidden');
    unit2Container.classList.add('hidden');

    showView('view-input');

    setTimeout(() => {
        document.getElementById('actual-qty').focus();
    }, 300);
}

        async function cancelInput() {
            document.getElementById('actual-qty').value = '';
            const unit2Select = document.getElementById('unit2-select');
            if (unit2Select) unit2Select.value = '';
            currentScanData.unit2 = '';
            await stopZXingScanner();
            showView('view-scanner');
            initScanner();
        }

        async function submitCount() {
            const actualQty = document.getElementById('actual-qty').value.trim();
            const unit2Select = document.getElementById('unit2-select');
            const unit2 = unit2Select ? unit2Select.value : '';

            if (!actualQty) {
                Swal.fire({ icon: 'warning', title: 'กรุณากรอกจำนวน', text: 'โปรดระบุจำนวนที่ตรวจนับได้จริง', confirmButtonColor: '#3085d6' });
                return;
            }

            if (/^RC/i.test(currentScanData.lotNumber) && !unit2) {
                Swal.fire({ icon: 'warning', title: 'กรุณาเลือก Unit2', text: 'สำหรับรายการ RC จำเป็นต้องระบุ Unit2 ก่อนบันทึกข้อมูล', confirmButtonColor: '#3085d6' });
                return;
            }

            currentScanData.actualQty = actualQty;
            currentScanData.unit2 = unit2;

            const payload = {
                zone: currentSession.zone,
                location: currentSession.location,
                responsiblePerson: currentSession.responsiblePerson,
                partNumber: currentScanData.partNumber,
                qrQty: currentScanData.qrQty,
                unit: currentScanData.unit,
                lotNumber: currentScanData.lotNumber,
                serialNumber: currentScanData.serialNumber,
                actualQty: currentScanData.actualQty,
                unit2: currentScanData.unit2
            };

            const loadingOverlay = document.getElementById('loading-overlay');
            loadingOverlay.classList.remove('hidden');

            try {
                const response = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    body: new URLSearchParams({
                        data: JSON.stringify(payload)
                    })
                });

                const result = await response.json();
                loadingOverlay.classList.add('hidden');

                if (result.status === 'success') {
                    Swal.fire({
                        icon: 'success',
                        title: 'บันทึกสำเร็จ',
                        text: result.message || 'บันทึกข้อมูลเรียบร้อยแล้ว',
                        timer: 1500,
                        showConfirmButton: false
                    }).then(() => {
                        document.getElementById('actual-qty').value = '';
                        if (unit2Select) unit2Select.value = '';
                        showView('view-scanner');
                        initScanner();
                    });
                } else {
                    Swal.fire({ icon: 'error', title: 'เกิดข้อผิดพลาด', text: result.message || 'ไม่สามารถบันทึกข้อมูลได้' });
                }
            } catch (error) {
                loadingOverlay.classList.add('hidden');
                Swal.fire({ icon: 'error', title: 'เชื่อมต่อล้มเหลว', text: error.toString() });
            }
        }
    </script>
</body>
</html>
