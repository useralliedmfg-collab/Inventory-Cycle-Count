        function updateLocations() {

    const zoneSelect = document.getElementById('zone-select');
    const locationSelect = document.getElementById('location-select');

    const zone = zoneSelect.value;

    console.log("ZONE:", zone);

    // ล้าง Location
    locationSelect.innerHTML = '';

    // ยังไม่เลือก Zone
    if (!zone) {

        locationSelect.disabled = true;

        const option = document.createElement('option');
        option.value = '';
        option.textContent = '-- กรุณาเลือกโซนก่อน --';

        locationSelect.appendChild(option);

        return;
    }

    // ดึง Location
    const locations = MOCK_ZONES[zone];

    console.log("LOCATION:", locations);

    if (!locations || locations.length === 0) {

        locationSelect.disabled = true;

        const option = document.createElement('option');
        option.value = '';
        option.textContent = '-- ไม่พบ Location --';

        locationSelect.appendChild(option);

        return;
    }

    // Default
    const defaultOption = document.createElement('option');

    defaultOption.value = '';
    defaultOption.textContent = '-- เลือกพื้นที่ปฏิบัติงาน --';
    defaultOption.disabled = true;
    defaultOption.selected = true;

    locationSelect.appendChild(defaultOption);

    // เพิ่ม Location
    locations.forEach(function(location) {

        const option = document.createElement('option');

        option.value = location;
        option.textContent = location;

        locationSelect.appendChild(option);

    });

    // เปิด Dropdown
    locationSelect.disabled = false;

}

        // --- STREAMING_CHUNK:Scanner Logic via ZXing ---
        function goToScanner() {

    const zone =
        document.getElementById('zone-select').value;

    const loc =
        document.getElementById('location-select').value;

    const resp =
        document.getElementById('responsible-name').value.trim();

            if (!zone || !loc || !resp) {
                Swal.fire({
                    icon: 'warning',
                    title: 'ข้อมูลไม่ครบถ้วน',
                    text: 'กรุณากรอกข้อมูลผู้ตรวจนับให้ครบถ้วนก่อนเริ่มสแกน',
                    confirmButtonColor: '#3085d6'
                });
                return;
            }

            currentSession.zone = zone;
            currentSession.location = loc;
            currentSession.responsiblePerson = resp;

            showView('view-scanner');

setTimeout(() => {
    initScanner();
}, 150);
        }

        // ==========================================
// ZXING SCANNER
// ==========================================

let zxingCodeReader = null;

let availableCameras = [];

let currentCameraIndex = 0;

let selectedDeviceId = null;

let currentVideoTrack = null;

let torchEnabled = false;

let isScanning = false;

let scanLocked = false;


// ==========================================
// INIT SCANNER
// ==========================================

async function initScanner() {

    const errorBox =
        document.getElementById("camera-error");

    errorBox.classList.add("hidden");

    scanLocked = false;

    torchEnabled = false;

    updateTorchButton(false);


    // ==========================================
    // STOP OLD CAMERA
    // ==========================================

    await stopZXingScanner();


    // ==========================================
    // CREATE ZXING
    // ==========================================

    if (!zxingCodeReader) {

        zxingCodeReader =
            new ZXing.BrowserMultiFormatReader();

    }


    try {

        // ==========================================
        // GET CAMERAS
        // ==========================================

        availableCameras =
            await zxingCodeReader.listVideoInputDevices();


        if (
            !availableCameras ||
            availableCameras.length === 0
        ) {

            throw new Error(
                "ไม่พบกล้องในอุปกรณ์นี้"
            );

        }


        console.log(
            "CAMERAS:",
            availableCameras
        );


        // ==========================================
        // FIND BACK CAMERA
        // ==========================================

        let backCameraIndex =
            availableCameras.findIndex(camera => {

                const label =
                    (camera.label || "")
                        .toLowerCase();

                return (
                    label.includes("back") ||
                    label.includes("rear") ||
                    label.includes("environment") ||
                    label.includes("หลัง")
                );

            });


        // ถ้าหา Back ไม่เจอ
        // ใช้กล้องตัวสุดท้าย
        if (backCameraIndex === -1) {

            backCameraIndex =
                availableCameras.length - 1;

        }


        currentCameraIndex =
            backCameraIndex;


        selectedDeviceId =
            availableCameras[
                currentCameraIndex
            ].deviceId;


        // ==========================================
        // SWITCH BUTTON
        // ==========================================

        const switchButton =
            document.getElementById(
                "btn-switch-cam"
            );


        if (
            availableCameras.length > 1
        ) {

            switchButton.classList.remove(
                "hidden"
            );

        } else {

            switchButton.classList.add(
                "hidden"
            );

        }


        // ==========================================
        // START
        // ==========================================

        await startZXingCamera();

    }

    catch (error) {

        console.error(
            "CAMERA ERROR:",
            error
        );


        errorBox.classList.remove(
            "hidden"
        );


        document.getElementById(
            "camera-error-msg"
        ).innerHTML =

            "เปิดกล้องไม่ได้<br><br>" +

            "กรุณากดอนุญาตการใช้งานกล้อง<br>" +

            "แล้วลองใหม่อีกครั้ง";

    }

}


// ==========================================
// START CAMERA
// ==========================================

async function startZXingCamera() {

    scanLocked = false;

    isScanning = true;


    const video =
        document.getElementById(
            "zxing-video"
        );


    // ==========================================
    // START ZXING
    // ==========================================

    await zxingCodeReader.decodeFromVideoDevice(

        selectedDeviceId,

        video,

        async (result, error) => {

            // ==========================================
            // NO RESULT
            // ==========================================

            if (!result) {

                return;

            }


            // ==========================================
            // PREVENT DUPLICATE
            // ==========================================

            if (scanLocked) {

                return;

            }


            scanLocked = true;


            console.log(
                "SCAN:",
                result.text
            );


            // ==========================================
            // STOP CAMERA
            // ==========================================

            await stopZXingScanner();


            // ==========================================
            // PROCESS
            // ==========================================

            processScannedData(
                result.text
            );

        }

    );


    // ==========================================
    // GET VIDEO TRACK
    // ==========================================

    setTimeout(
        async () => {

            try {

                const stream =
                    video.srcObject;


                if (!stream) {

                    return;

                }


                const tracks =
                    stream.getVideoTracks();


                if (
                    !tracks ||
                    !tracks.length
                ) {

                    return;

                }


                currentVideoTrack =
                    tracks[0];


                console.log(
                    "VIDEO TRACK:",
                    currentVideoTrack.getSettings()
                );


                // ==========================================
                // AUTO FOCUS
                // ==========================================

                await applyAutoFocus(
                    currentVideoTrack
                );


                // ==========================================
                // TORCH SUPPORT
                // ==========================================

                checkTorchSupport(
                    currentVideoTrack
                );

            }

            catch (error) {

                console.log(
                    "CAMERA CONTROL ERROR:",
                    error
                );

            }

        },
        700
    );

}


// ==========================================
// AUTO FOCUS
// ==========================================

async function applyAutoFocus(track) {

    if (!track) {

        return;

    }


    try {

        const capabilities =
            track.getCapabilities
                ? track.getCapabilities()
                : {};


        console.log(
            "CAMERA CAPABILITIES:",
            capabilities
        );


        if (
            capabilities.focusMode &&
            capabilities.focusMode.includes(
                "continuous"
            )
        ) {

            await track.applyConstraints({

                advanced: [

                    {
                        focusMode:
                            "continuous"
                    }

                ]

            });


            console.log(
                "AUTO FOCUS: ON"
            );

        }

        else {

            console.log(
                "AUTO FOCUS: NOT SUPPORTED"
            );

        }

    }

    catch (error) {

        console.log(
            "AUTO FOCUS ERROR:",
            error
        );

    }

}


// ==========================================
// CHECK TORCH
// ==========================================

function checkTorchSupport(track) {

    const button =
        document.getElementById(
            "btn-torch"
        );


    if (!track) {

        button.disabled = true;

        button.classList.add(
            "opacity-40"
        );

        return;

    }


    try {

        const capabilities =
            track.getCapabilities
                ? track.getCapabilities()
                : {};


        if (capabilities.torch) {

            button.disabled = false;

            button.classList.remove(
                "opacity-40"
            );


            console.log(
                "TORCH: SUPPORTED"
            );

        }

        else {

            button.disabled = true;

            button.classList.add(
                "opacity-40"
            );


            console.log(
                "TORCH: NOT SUPPORTED"
            );

        }

    }

    catch (error) {

        button.disabled = true;

        button.classList.add(
            "opacity-40"
        );

    }

}


// ==========================================
// TOGGLE TORCH
// ==========================================

async function toggleTorch() {

    if (!currentVideoTrack) {

        return;

    }


    try {

        const capabilities =
            currentVideoTrack.getCapabilities();


        if (!capabilities.torch) {

            Swal.fire({

                icon: "info",

                title: "ไม่รองรับ Flash",

                text:
                    "อุปกรณ์หรือเบราว์เซอร์นี้ไม่รองรับการเปิดไฟแฟลชผ่านกล้อง",

                confirmButtonText:
                    "ตกลง"

            });

            return;

        }


        torchEnabled =
            !torchEnabled;


        await currentVideoTrack.applyConstraints({

            advanced: [

                {
                    torch:
                        torchEnabled
                }

            ]

        });


        updateTorchButton(
            torchEnabled
        );


        console.log(
            "TORCH:",
            torchEnabled
        );

    }

    catch (error) {

        console.error(
            "TORCH ERROR:",
            error
        );

    }

}

function updateTorchButton(enabled) {

        document.getElementById(
            "btn-torch"
        );

        document.getElementById(
            "torch-text"
        );


    if (!button || !text) {

        );

}


// ==========================================
// SWITCH CAMERA
// ==========================================

async function switchCamera() {

    if (
        availableCameras.length < 2
    ) {

        return;

    }


    try {

        // ==========================================
        // STOP CURRENT
        // ==========================================

        await stopZXingScanner();


        // ==========================================
        // NEXT CAMERA
        // ==========================================

        currentCameraIndex =
            (
                currentCameraIndex + 1
            ) %
            availableCameras.length;


        selectedDeviceId =
            availableCameras[
                currentCameraIndex
            ].deviceId;


        console.log(
            "SWITCH CAMERA:",
            availableCameras[
                currentCameraIndex
            ].label
        );


        // ==========================================
        // RESET TORCH
        // ==========================================

        torchEnabled = false;

        updateTorchButton(false);


        // ==========================================
        // START
        // ==========================================

        await startZXingCamera();

    }

    catch (error) {

        console.error(
            "SWITCH CAMERA ERROR:",
            error
        );

    }

}


// ==========================================
// STOP SCANNER
// ==========================================

async function stopZXingScanner() {

    isScanning = false;

    scanLocked = true;

    torchEnabled = false;


    try {

        if (zxingCodeReader) {

            zxingCodeReader.reset();

        }

    }

    catch (error) {

        console.log(
            "ZXING RESET:",
            error
        );

    }


    // ==========================================
    // STOP VIDEO TRACK
    // ==========================================

    const video =
        document.getElementById(
            "zxing-video"
        );


    if (
        video &&
        video.srcObject
    ) {

        try {

            video.srcObject
                .getTracks()
                .forEach(track => {

                    try {

                        track.stop();

                    }

                    catch (e) {}

                });

        }

        catch (error) {}

        video.srcObject = null;

    }


    currentVideoTrack = null;

    updateTorchButton(false);

}


// ==========================================
// BACK
// ==========================================

async function stopScannerAndGoBack() {

    await stopZXingScanner();

    showView(
        "view-setup"
    );

}

        // --- STREAMING_CHUNK:Handling Scan Data and Parsing ---
        async function processScannedData(text) {

    console.log("QR DATA:", text);

    // ==========================================
    // SPLIT QR
    // ==========================================

    const parts = text
        .split(',')
        .map(x => x.trim());

    console.log("QR PARTS:", parts);


    // ==========================================
    // FIND WO / WO2 / RC
    // ==========================================

    let lotNumber = "";
    let qrType = "";


    for (let i = 0; i < parts.length; i++) {

        const value = parts[i];

        // WO2 ต้องเช็กก่อน WO
        if (/^WO2([-_]|$)/i.test(value)) {

            lotNumber = value;
            qrType = "WO2";
            break;

        }

        // WO
        if (/^WO([-_]|$)/i.test(value)) {

            lotNumber = value;
            qrType = "WO";
            break;

        }

        // RC
        if (/^RC([-_]|$)/i.test(value)) {

            lotNumber = value;
            qrType = "RC";
            break;

        }

    }


    // ==========================================
    // NOT FOUND LOT
    // ==========================================

    if (!lotNumber) {

        Swal.fire({

            icon: 'warning',

            title: 'ไม่พบ WO / WO2 / RC',

            text:
                'ไม่พบหมายเลข WO, WO2 หรือ RC ใน QR Code นี้',

            confirmButtonText:
                'สแกนใหม่'

        }).then(() => {

            initScanner();

        });

        return;

    }


    console.log(
        "FOUND LOT:",
        lotNumber,
        "TYPE:",
        qrType
    );


    // ==========================================
    // RESET DATA
    // ==========================================

    currentScanData = {

    partNumber: "",
    qrQty: "",
    unit: "",
    lotNumber: lotNumber,
    serialNumber: "",
    unit2: "",
    qrType: qrType

};


    // ==========================================
    // RESET UI
    // ==========================================

    document
        .getElementById('rc-unit-display')
        .classList
        .add('hidden');

    document
        .getElementById('unit2-container')
        .classList
        .add('hidden');

    document
        .getElementById('display-unit')
        .textContent = "-";

    document
        .getElementById('unit2-select')
        .value = "";


    // ==========================================
    // SHOW LOADING
    // ==========================================

    Swal.fire({

        title: 'กำลังค้นหาข้อมูล',

        text:
            'กำลังค้นหา Part Number ของ ' +
            lotNumber,

        allowOutsideClick: false,

        didOpen: () => {

            Swal.showLoading();

        }

    });


    // ==========================================
    // FIND EXISTING LOT FROM GAS
    // ==========================================

    findExistingLotFromGAS(lotNumber)

        .then(existing => {

            console.log(
                "FIND LOT RESULT:",
                existing
            );


            // ==========================================
            // LOT FOUND IN SHEET
            // ==========================================

            if (
                existing &&
                existing.status === 'success'
            ) {

                currentScanData.partNumber =
                    existing.partNumber || "";

                currentScanData.qrQty =
                    existing.qrQty || "";

                currentScanData.unit =
                    existing.unit || "";

                currentScanData.serialNumber =
                    existing.serialNumber || "";

                currentScanData.lotNumber =
                    existing.lotNumber ||
                    lotNumber;


                console.log(
                    "PART FROM SHEET:",
                    currentScanData.partNumber
                );


            }

            // ==========================================
            // LOT NOT FOUND
            // ==========================================

            else {

                console.log(
                    "LOT NOT FOUND IN SHEET"
                );


                // ==========================================
                // FALLBACK
                // QR FORMAT
                // Part Number = ช่องแรก
                // ==========================================

                currentScanData.partNumber =
                    parts[0] || "";


                if (
                    qrType === "WO" ||
                    qrType === "WO2"
                ) {

                    currentScanData.qrQty =
                        parts[1] || "";

                    currentScanData.unit =
                        parts[2] || "";

                    currentScanData.serialNumber =
                        parts.length >= 5
                            ? parts[4]
                            : "-";

                }


                if (qrType === "RC") {

                    /*
                        RC FORMAT

                        1 = Part Number
                        2 = RC Number
                        3 = RM01
                        4 = E4
                        5 = Qty
                        6 = POD
                        7 = Description
                        8 = Serial
                    */

                    currentScanData.qrQty =
                        parts[4] || "";

                    currentScanData.serialNumber =
                        parts[parts.length - 1] || "-";

                }

            }


            // ==========================================
            // CLOSE LOADING
            // ==========================================

            Swal.close();


            // ==========================================
            // RC
            // ==========================================

            if (qrType === "RC") {

    currentScanData.unit = "";

    document
        .getElementById('unit2-container')
        .classList
        .remove('hidden');

    document
        .getElementById('rc-unit-display')
        .classList
        .remove('hidden');

    document
        .getElementById('display-unit')
        .textContent =
        "กำลังค้นหา...";


    // ==========================================
    // FIND UNIT FROM PART MASTER
    // ==========================================

    try {

        const unit =
            await getPartUnitFromMaster(
                currentScanData.partNumber
            );

        currentScanData.unit =
            unit;

        document
            .getElementById('display-unit')
            .textContent =
            unit;

    }

    catch (error) {

        console.error(
            "UNIT ERROR:",
            error
        );

        currentScanData.unit = "";

        document
            .getElementById('display-unit')
            .textContent =
            "-";


        Swal.close();


        await Swal.fire({

            icon: 'warning',

            title: 'ไม่พบ Unit',

            text:
                error.message ||
                'ไม่สามารถค้นหา Unit ได้',

            confirmButtonText:
                'ตกลง'

        });


        // กลับไป Scanner
        initScanner();

        return;

    }

}

            // ==========================================
            // WO / WO2
            // ==========================================

            if (
                qrType === "WO" ||
                qrType === "WO2"
            ) {

                document
                    .getElementById('rc-unit-display')
                    .classList
                    .add('hidden');


                document
                    .getElementById('unit2-container')
                    .classList
                    .add('hidden');

            }


            // ==========================================
            // UPDATE UI
            // ==========================================

            document
                .getElementById('display-lot')
                .textContent =
                currentScanData.lotNumber;


            document
                .getElementById('display-part')
                .textContent =
                currentScanData.partNumber || "-";


            document
                .getElementById('actual-qty')
                .value = "";


            // ==========================================
            // SHOW INPUT
            // ==========================================

            showView(
                'view-input'
            );

        })

        .catch(error => {

            console.error(
                "FIND LOT ERROR:",
                error
            );


            Swal.close();


            Swal.fire({

                icon: 'error',

                title: 'ค้นหาข้อมูลไม่สำเร็จ',

                text:
                    error.message ||
                    'ไม่สามารถค้นหาข้อมูล Lot ได้',

                confirmButtonText:
                    'สแกนใหม่'

            }).then(() => {

                initScanner();

            });

        });

}

    // ==========================================
// FIND EXISTING LOT FROM GAS
// ==========================================

function findExistingLotFromGAS(lotNumber) {

    if (!lotNumber) {

        return Promise.reject(
            new Error('ไม่พบ Lot Number')
        );

    }


    return fetch(
        SCRIPT_URL,
        {
            method: 'POST',

            headers: {
                'Content-Type':
                    'application/x-www-form-urlencoded;charset=UTF-8'
            },

            body:
                new URLSearchParams({

                    data:
                        JSON.stringify({

                            action: 'findLot',

                            lotNumber:
                                lotNumber.trim()

                        })

                })
        }
    )

    .then(response => {

        if (!response.ok) {

            throw new Error(
                'Google Apps Script HTTP Error: ' +
                response.status
            );

        }

        return response.text();

    })

    .then(text => {

        console.log(
            'FIND LOT RESPONSE:',
            text
        );


        let result;

        try {

            result =
                JSON.parse(text);

        }

        catch (error) {

            console.error(
                'INVALID JSON:',
                text
            );

            throw new Error(
                'Google Apps Script ไม่ส่ง JSON กลับมา'
            );

        }


        return result;

    });

}
        
        // ==========================================
// GET UNIT FROM PART MASTER
// ==========================================

function getPartUnitFromMaster(partNumber) {

    if (!partNumber) {

        return Promise.reject(
            new Error('ไม่พบ Part Number')
        );

    }


    return fetch(
        SCRIPT_URL,
        {
            method: 'POST',

            headers: {
                'Content-Type':
                    'application/x-www-form-urlencoded;charset=UTF-8'
            },

            body:
                new URLSearchParams({

                    data:
                        JSON.stringify({

                            action:
                                'getPartUnit',

                            partNumber:
                                partNumber.trim()

                        })

                })
        }
    )

    .then(response => {

        if (!response.ok) {

            throw new Error(
                'Google Apps Script HTTP Error: ' +
                response.status
            );

        }

        return response.json();

    })

    .then(result => {

        if (
            result.status !== 'success'
        ) {

            throw new Error(
                result.message ||
                'ไม่สามารถค้นหา Unit ได้'
            );

        }


        if (!result.unit) {

            throw new Error(
                'ไม่พบ Unit ของ Part Number: ' +
                partNumber +
                ' ใน Part_Master'
            );

        }


        return result.unit;

    });

}

if (
