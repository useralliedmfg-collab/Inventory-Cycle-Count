<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Inventory Cycle Count - AMS</title>
    <!-- Tailwind CSS for Mobile-First Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- ZXing for robust mobile camera scanning (QR & Barcode) -->
    <script type="text/javascript" src="https://unpkg.com/@zxing/library@0.19.1"></script>
    <!-- SweetAlert2 for beautiful non-blocking popups -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Google Fonts: Prompt -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            background-color: #f3f4f6;
            touch-action: pan-y;
        }
        #reader {
            width: 100%;
            max-width: 420px;
            height: 420px;
            border-radius: 16px;
            overflow: hidden;
            background: #000;
            position: relative;
        }
        #reader video {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;
            display: block;
            filter: contrast(1.15) brightness(1.05);
        }
        .scanner-frame {
            position: absolute;
            width: 72%;
            height: 72%;
            left: 14%;
            top: 14%;
            border: 3px solid rgba(255,255,255,0.9);
            border-radius: 18px;
            pointer-events: none;
            z-index: 5;
            box-shadow: 0 0 0 9999px rgba(0,0,0,0.15);
        }
        .scanner-corner {
            position: absolute;
            width: 35px;
            height: 35px;
            border-color: #22c55e;
            border-style: solid;
        }
        .scanner-corner.tl { top: -3px; left: -3px; border-width: 5px 0 0 5px; border-radius: 12px 0 0 0; }
        .scanner-corner.tr { top: -3px; right: -3px; border-width: 5px 5px 0 0; border-radius: 0 12px 0 0; }
        .scanner-corner.bl { bottom: -3px; left: -3px; border-width: 0 0 5px 5px; border-radius: 0 0 0 12px; }
        .scanner-corner.br { bottom: -3px; right: -3px; border-width: 0 5px 5px 0; border-radius: 0 0 12px 0; }
        .swal2-popup { font-family: 'Prompt', sans-serif !important; border-radius: 1rem !important; }
        #view-input { position: relative; min-height: 0; }
        #actual-qty { position: relative; z-index: 5; -webkit-user-select: text; user-select: text; }
        #btn-submit { position: relative; z-index: 10; touch-action: manipulation; }
    </style>
</head>
<body class="text-gray-800 antialiased min-h-screen flex flex-col items-center">

    <div class="w-full max-w-md bg-white shadow-sm flex flex-col items-center py-4 px-4 sticky top-0 z-10">
        <div class="w-full flex justify-between items-center mb-1">
            <img src="https://www.alliedmfg.co.th/wp-content/uploads/2026/07/AMS-LOGO-V1.png" alt="AMS Logo" class="h-8 object-contain">
            <button onclick="openSettingsModal()" class="text-gray-500 hover:text-blue-600 p-2 rounded-full text-sm flex items-center gap-1 bg-gray-50 border border-gray-200">
                ⚙️ ตั้งค่าลิงก์
            </button>
        </div>
        <h1 class="text-lg font-semibold text-blue-900 tracking-wide">Inventory Cycle Count2</h1>
    </div>

    <main class="w-full max-w-md flex-1 bg-white shadow-md flex flex-col relative overflow-hidden">
        <!-- AMS WATERMARK -->
        <div class="absolute inset-0 pointer-events-none z-0" style="background-image: url('https://www.alliedmfg.co.th/wp-content/uploads/2026/07/AMS-LOGO-V1.png'); background-repeat: no-repeat; background-position: center; background-size: 320px; opacity: 0.035;"></div>

        <!-- VIEW 1: SETUP / LOGIN -->
        <div id="view-setup" class="p-6 flex flex-col space-y-5 flex-1 relative z-10">
            <h2 class="text-xl font-medium text-gray-700 border-b pb-2">ข้อมูลผู้ตรวจนับ</h2>
            
            <div>
                <label class="block text-sm font-medium text-gray-600 mb-1">โซนตรวจนับ (Zone)</label>
                <select id="zone-select" onchange="updateLocations()" class="w-full border border-gray-300 rounded-lg p-3 text-lg bg-gray-50 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none">
                    <option value="" disabled selected>-- เลือกโซนตรวจนับ --</option>
                    <option value="ZONE_A">Zone A</option>
                    <option value="ZONE_B">Zone B</option>
                    <option value="ZONE_C">Zone C</option>
                    <option value="ZONE_D">Zone D</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-600 mb-1">พื้นที่ปฏิบัติงาน (Location)</label>
                <select id="location-select" class="w-full border border-gray-300 rounded-lg p-3 text-lg bg-gray-50 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none" disabled>
                    <option value="" disabled selected>-- กรุณาเลือกโซนก่อน --</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-600 mb-1">ชื่อผู้รับผิดชอบ (Responsible Person)</label>
                <input type="text" id="responsible-name" placeholder="ระบุชื่อผู้ตรวจ" enterkeyhint="done" onkeydown="if(event.key === 'Enter') { event.preventDefault(); goToScanner(); }" class="w-full border border-gray-300 rounded-lg p-3 text-lg bg-gray-50 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none">
            </div>

            <div class="flex-1"></div>

            <button onclick="goToScanner()" class="w-full bg-blue-600 text-white font-semibold rounded-xl p-4 text-xl shadow-lg active:bg-blue-700 transition-colors flex justify-center items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
                เริ่มเปิดกล้องสแกน
            </button>
        </div>

        <!-- VIEW 2: SCANNER -->
        <div id="view-scanner" class="hidden p-4 flex flex-col flex-1 h-full bg-gray-900 relative z-10">
            <div class="text-center mb-4">
                <h2 class="text-white text-lg font-semibold tracking-wider">SCAN QR CODE / BARCODE</h2>
                <p class="text-gray-400 text-sm">นำบาร์โค้ดมาให้อยู่ในกรอบเพื่อสแกน</p>
            </div>

            <div class="flex-1 flex flex-col justify-center items-center w-full relative">
                <div id="reader">
                    <video id="zxing-video" autoplay muted playsinline></video>
                    <div class="scanner-frame">
                        <div class="scanner-corner tl"></div>
                        <div class="scanner-corner tr"></div>
                        <div class="scanner-corner bl"></div>
                        <div class="scanner-corner br"></div>
                    </div>
                </div>
                
                <div id="camera-error" class="hidden absolute inset-0 bg-black/80 flex flex-col items-center justify-center p-6 text-center z-20">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 text-red-500 mb-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                    </svg>
                    <p class="text-white mb-4" id="camera-error-msg">ไม่สามารถเปิดกล้องได้<br>กรุณาอนุญาตการใช้งานกล้อง</p>
                    <button onclick="initScanner()" class="bg-blue-600 text-white px-6 py-2 rounded-lg font-medium shadow active:bg-blue-700">ลองเปิดกล้องอีกครั้ง</button>
                </div>
            </div>

            <div class="mt-6 mb-4 grid grid-cols-3 gap-2">
                <button onclick="stopScannerAndGoBack()" class="bg-gray-700 text-white font-medium rounded-lg p-3 active:bg-gray-600 transition-colors">← ย้อนกลับ</button>
                <button onclick="toggleTorch()" id="btn-torch" class="bg-gray-700 text-white font-medium rounded-lg p-3 active:bg-yellow-500 transition-colors flex justify-center items-center gap-1">
                    🔦 <span id="torch-text">ไฟ</span>
                </button>
                <button onclick="switchCamera()" id="btn-switch-cam" class="bg-gray-700 text-white font-medium rounded-lg p-3 active:bg-gray-600 transition-colors flex justify-center items-center gap-1 hidden">
                    🔄 <span>สลับ</span>
                </button>
            </div>
        </div>

        <!-- VIEW 3: INPUT COUNT -->
        <div id="view-input" class="hidden p-6 flex flex-col flex-1 h-full relative z-10">
            <div class="bg-blue-50 border border-blue-100 rounded-xl p-5 mb-6 text-center shadow-sm">
                <p class="text-sm text-blue-600 font-medium mb-1">LOT NUMBER</p>
                <h2 id="display-lot" class="text-3xl font-bold text-gray-900 break-all">WO-000000</h2>
                <p class="text-xs text-gray-500 mt-2">Part: <span id="display-part"></span></p>
                
                <div id="rc-unit-display" class="hidden mt-3">
                    <p class="text-sm text-blue-600 font-medium">UNIT</p>
                    <p id="display-unit" class="text-2xl font-bold text-gray-900">-</p>
                </div>
            </div>

            <div id="unit2-container" class="hidden mb-6">
                <label class="block text-center text-lg font-semibold text-gray-700 mb-3">Unit2</label>
                <select id="unit2-select" class="w-full border-2 border-blue-300 rounded-xl p-4 text-lg bg-white focus:ring-4 focus:ring-blue-200 focus:border-blue-500 outline-none">
                    <option value="" selected>-- กรุณาเลือก Unit2 --</option>
                    <option value="M">M</option>
                    <option value="MM">MM</option>
                    <option value="RL">RL</option>
                    <option value="SHT">SHT</option>
                    <option value="BLK">BLK</option>
                    <option value="PCS">PCS</option>
                    <option value="LTR">LTR</option>
                    <option value="KG">KG</option>
                    <option value="SET">SET</option>
                </select>
            </div>

            <div class="mb-8">
                <label class="block text-center text-lg font-semibold text-gray-700 mb-3">จำนวนที่ตรวจนับได้จริง</label>
                <input type="number" id="actual-qty" inputmode="numeric" pattern="[0-9]*" enterkeyhint="done" onkeydown="if(event.key === 'Enter') { event.preventDefault(); submitCount(); }" class="w-full border-2 border-blue-300 rounded-xl p-4 text-center text-4xl font-bold text-gray-800 bg-white focus:ring-4 focus:ring-blue-200 focus:border-blue-500 outline-none transition-all shadow-inner" placeholder="0">
            </div>
            
            <div class="flex-1"></div>

            <div class="flex gap-4">
                <button onclick="cancelInput()" class="w-1/3 bg-gray-200 text-gray-700 font-semibold rounded-xl p-4 text-lg active:bg-gray-300 transition-colors">ยกเลิก</button>
                <button type="button" onclick="submitCount()" id="btn-submit" class="w-2/3 bg-green-600 text-white font-semibold rounded-xl p-4 text-xl shadow-lg active:bg-green-700 transition-colors flex justify-center items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                    </svg>
                    บันทึกข้อมูล
                </button>
            </div>
        </div>

        <!-- LOADING OVERLAY -->
        <div id="loading-overlay" class="hidden absolute inset-0 bg-white/90 z-50 flex flex-col items-center justify-center">
            <div class="animate-spin rounded-full h-14 w-14 border-b-4 border-blue-600 mb-4"></div>
            <p id="loading-text" class="text-blue-800 font-medium text-lg animate-pulse">กำลังบันทึกข้อมูล...</p>
        </div>
    </main>

    <script>
        // GOOGLE APPS SCRIPT WEB APP URL (ใส่ URL ตรงนี้โดยไม่ต้องรอกดเชื่อมต่อ)
        let WEB_APP_URL = localStorage.getItem('ams_script_url') || 'https://script.google.com/macros/s/YOUR_DEPLOYMENT_ID/exec';

// ==========================================
// PART MASTER CACHE
// ==========================================
let partMasterCache = {};
let partMasterLoaded = false;

// ==========================================
// LOAD PART MASTER ONCE
// ==========================================
async function loadPartMaster() {
    if (partMasterLoaded) return;

    try {
        const response = await fetch(WEB_APP_URL, {
            method: 'POST',
            body: new URLSearchParams({
                data: JSON.stringify({
                    action: 'loadPartMaster'
                })
            })
        });

        const result = await response.json();

        if (result.status === 'success') {
            partMasterCache = result.data || {};
            partMasterLoaded = true;

            console.log(
                'Part Master loaded:',
                Object.keys(partMasterCache).length,
                'parts'
            );
        } else {
            console.error('LOAD PART MASTER ERROR:', result.message);
        }

    } catch (error) {
        console.error('LOAD PART MASTER CONNECTION ERROR:', error);
    }
}

        const MOCK_ZONES = {
            "ZONE_A": ["A1-1", "A1-2", "A1-3"],
            "ZONE_B": ["B1-1", "B1-2", "B1-3"],
            "ZONE_C": ["C1-1", "C1-2", "C1-3"],
            "ZONE_D": ["D1-1", "D1-2", "D1-3", "D1-4"]
        };

        let currentSession = { zone: "", location: "", responsiblePerson: "" };
        let currentScanData = { partNumber: "", qrQty: "", unit: "", lotNumber: "", serialNumber: "", unit2: "" };

        window.addEventListener('DOMContentLoaded', () => {
            // ไม่บังคับเปิด Modal แล้ว เพื่อให้ใช้งานได้ทันทีถ้าใส่ URL ไว้ในโค้ดแล้ว
        });

        async function openSettingsModal(isRequired = false) {
            const { value: url } = await Swal.fire({
                title: 'ตั้งค่า Google Apps Script URL',
                input: 'url',
                inputLabel: 'วาง URL ที่ได้จากการ Deploy Web App',
                inputValue: WEB_APP_URL.includes('YOUR_') ? '' : WEB_APP_URL,
                inputPlaceholder: 'https://script.google.com/macros/s/.../exec',
                showCancelButton: !isRequired,
                confirmButtonText: 'บันทึก',
                cancelButtonText: 'ยกเลิก',
                allowOutsideClick: !isRequired,
                allowEscapeKey: !isRequired
            });

            if (url) {
                WEB_APP_URL = url.trim();
                localStorage.setItem('ams_script_url', WEB_APP_URL);
                Swal.fire({ icon: 'success', title: 'บันทึก URL สำเร็จ', timer: 1200, showConfirmButton: false });
            } else if (isRequired && (!WEB_APP_URL || WEB_APP_URL.includes('YOUR_'))) {
                Swal.fire({ icon: 'warning', title: 'จำเป็นต้องระบุ URL', text: 'กรุณากรอกลิงก์ Web App เพื่อใช้งานระบบ', confirmButtonText: 'ลองอีกครั้ง' }).then(() => {
                    openSettingsModal(true);
                });
            }
        }

        function updateLocations() {
            const zoneSelect = document.getElementById('zone-select');
            const locationSelect = document.getElementById('location-select');
            const selectedZone = zoneSelect.value;
            locationSelect.innerHTML = '<option value="" disabled selected>-- เลือกพื้นที่ปฏิบัติงาน --</option>';
            if (selectedZone && MOCK_ZONES[selectedZone]) {
                MOCK_ZONES[selectedZone].forEach(loc => {
                    const option = document.createElement('option');
                    option.value = loc;
                    option.textContent = loc;
                    locationSelect.appendChild(option);
                });
                locationSelect.disabled = false;
            } else {
                locationSelect.disabled = true;
            }
        }

        function showView(viewId) {
            document.getElementById('view-setup').classList.add('hidden');
            document.getElementById('view-scanner').classList.add('hidden');
            document.getElementById('view-input').classList.add('hidden');
            document.getElementById(viewId).classList.remove('hidden');
            document.getElementById(viewId).classList.add('flex');
        }

        function goToScanner() {
            if (!WEB_APP_URL || WEB_APP_URL.includes('YOUR_')) {
                openSettingsModal(true);
                return;
            }

            const zone = document.getElementById('zone-select').value;
            const loc = document.getElementById('location-select').value;
            const resp = document.getElementById('responsible-name').value.trim();

            if (!zone || !loc || !resp) {
                Swal.fire({ icon: 'warning', title: 'ข้อมูลไม่ครบถ้วน', text: 'กรุณากรอกข้อมูลผู้ตรวจนับให้ครบถ้วนก่อนเริ่มสแกน', confirmButtonColor: '#3085d6' });
                return;
            }

            currentSession.zone = zone;
            currentSession.location = loc;
            currentSession.responsiblePerson = resp;

            showView('view-scanner');
            setTimeout(() => { initScanner(); }, 150);
        }

        let zxingCodeReader = null;
        let availableCameras = [];
        let currentCameraIndex = 0;
        let selectedDeviceId = null;
        let currentVideoTrack = null;
        let torchEnabled = false;
        let scanLocked = false;

        async function initScanner() {
            const errorBox = document.getElementById("camera-error");
            errorBox.classList.add("hidden");
            scanLocked = false;
            torchEnabled = false;
            updateTorchButton(false);

            await stopZXingScanner();

            if (!zxingCodeReader) {
                // บังคับโหมด TRY_HARDER สำหรับสแกนบาร์โค้ดจาง/ความคมชัดต่ำ
                const hints = new Map();
                hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
                zxingCodeReader = new ZXing.BrowserMultiFormatReader(hints);
            }

            try {
                availableCameras = await zxingCodeReader.listVideoInputDevices();
                if (!availableCameras || availableCameras.length === 0) {
                    throw new Error("ไม่พบกล้องในอุปกรณ์นี้");
                }

                let backCameraIndex = availableCameras.findIndex(camera => {
                    const label = (camera.label || "").toLowerCase();
                    return label.includes("back") || label.includes("rear") || label.includes("environment") || label.includes("หลัง");
                });

                if (backCameraIndex === -1) backCameraIndex = availableCameras.length - 1;
                currentCameraIndex = backCameraIndex;
                selectedDeviceId = availableCameras[currentCameraIndex].deviceId;

                const switchButton = document.getElementById("btn-switch-cam");
                if (availableCameras.length > 1) {
                    switchButton.classList.remove("hidden");
                } else {
                    switchButton.classList.add("hidden");
                }

                await startZXingCamera();
            } catch (error) {
                console.error("CAMERA ERROR:", error);
                errorBox.classList.remove("hidden");
                document.getElementById("camera-error-msg").innerHTML = "เปิดกล้องไม่ได้<br><br>กรุณากดอนุญาตการใช้งานกล้อง<br>แล้วลองใหม่อีกครั้ง";
            }
        }

        async function startZXingCamera() {
            scanLocked = false;
            const video = document.getElementById("zxing-video");

            // กำหนดคอนสเตรนท์ขอความละเอียดสูง เพื่อจับภาพบาร์โค้ดจางได้ดีขึ้น
            const constraints = {
                video: {
                    deviceId: selectedDeviceId ? { exact: selectedDeviceId } : undefined,
                    width: { ideal: 1920, min: 1280 },
                    height: { ideal: 1080, min: 720 },
                    facingMode: "environment"
                }
            };

            try {
                await zxingCodeReader.decodeFromConstraints(constraints, video, async (result, error) => {
                    if (!result || scanLocked) return;
                    scanLocked = true;
                    await stopZXingScanner();
                    processScannedData(result.text);
                });
            } catch (err) {
                // Fallback หากอุปกรณ์ไม่รองรับ HD constraints
                await zxingCodeReader.decodeFromVideoDevice(selectedDeviceId, video, async (result, error) => {
                    if (!result || scanLocked) return;
                    scanLocked = true;
                    await stopZXingScanner();
                    processScannedData(result.text);
                });
            }

            setTimeout(async () => {
                try {
                    const stream = video.srcObject;
                    if (!stream) return;
                    const tracks = stream.getVideoTracks();
                    if (!tracks || !tracks.length) return;
                    currentVideoTrack = tracks[0];
                    await applyAutoFocus(currentVideoTrack);
                    checkTorchSupport(currentVideoTrack);
                } catch (error) {
                    console.log("CAMERA CONTROL ERROR:", error);
                }
            }, 700);
        }

        async function applyAutoFocus(track) {
            if (!track) return;
            try {
                const capabilities = track.getCapabilities ? track.getCapabilities() : {};
                if (capabilities.focusMode && capabilities.focusMode.includes("continuous")) {
                    await track.applyConstraints({ advanced: [{ focusMode: "continuous" }] });
                }
            } catch (error) {
                console.log("AUTO FOCUS ERROR:", error);
            }
        }

        function checkTorchSupport(track) {
            const button = document.getElementById("btn-torch");
            if (!track) {
                button.disabled = true;
                button.classList.add("opacity-40");
                return;
            }
            try {
                const capabilities = track.getCapabilities ? track.getCapabilities() : {};
                if (capabilities.torch) {
                    button.disabled = false;
                    button.classList.remove("opacity-40");
                } else {
                    button.disabled = true;
                    button.classList.add("opacity-40");
                }
            } catch (error) {
                button.disabled = true;
                button.classList.add("opacity-40");
            }
        }

        async function toggleTorch() {
            if (!currentVideoTrack) return;
            try {
                const capabilities = currentVideoTrack.getCapabilities();
                if (!capabilities.torch) {
                    Swal.fire({ icon: "info", title: "ไม่รองรับ Flash", text: "อุปกรณ์หรือเบราว์เซอร์นี้ไม่รองรับการเปิดไฟแฟลชผ่านกล้อง", confirmButtonText: "ตกลง" });
                    return;
                }
                torchEnabled = !torchEnabled;
                await currentVideoTrack.applyConstraints({ advanced: [{ torch: torchEnabled }] });
                updateTorchButton(torchEnabled);
            } catch (error) {
                torchEnabled = false;
                updateTorchButton(false);
            }
        }

        function updateTorchButton(enabled) {
            const button = document.getElementById("btn-torch");
            const text = document.getElementById("torch-text");
            if (!button || !text) return;
            if (enabled) {
                button.classList.remove("bg-gray-700");
                button.classList.add("bg-yellow-500");
                text.textContent = "ปิดไฟ";
            } else {
                button.classList.remove("bg-yellow-500");
                button.classList.add("bg-gray-700");
                text.textContent = "ไฟ";
            }
        }

        async function switchCamera() {
            if (availableCameras.length < 2) return;
            try {
                await stopZXingScanner();
                currentCameraIndex = (currentCameraIndex + 1) % availableCameras.length;
                selectedDeviceId = availableCameras[currentCameraIndex].deviceId;
                torchEnabled = false;
                updateTorchButton(false);
                await startZXingCamera();
            } catch (error) {
                console.error("SWITCH CAMERA ERROR:", error);
            }
        }

        async function stopZXingScanner() {
            scanLocked = true;
            torchEnabled = false;
            try {
                if (zxingCodeReader) zxingCodeReader.reset();
            } catch (error) {}

            const video = document.getElementById("zxing-video");
            if (video && video.srcObject) {
                try {
                    video.srcObject.getTracks().forEach(track => { try { track.stop(); } catch (e) {} });
                } catch (error) {}
                video.srcObject = null;
            }
            currentVideoTrack = null;
            updateTorchButton(false);
        }

        async function stopScannerAndGoBack() {
            await stopZXingScanner();
            showView("view-setup");
        }

        async function processScannedData(text) {
    const parts = text.split(',').map(x => x.trim());

    if (parts.length < 4) {
        Swal.fire({
            icon: 'error',
            title: 'รูปแบบไม่ถูกต้อง',
            text: 'ข้อมูล QR / Barcode ไม่ถูกต้อง',
            confirmButtonText: 'สแกนใหม่'
        }).then(() => {
            scanLocked = false;
            initScanner();
        });
        return;
    }

    let lotNumber = "";
    let qrType = "";

    for (let i = 0; i < parts.length; i++) {
        const value = parts[i];

        if (/^WO2([-_]|$)/i.test(value)) {
            lotNumber = value;
            qrType = "WO2";
            break;
        }

        if (/^WO([-_]|$)/i.test(value)) {
            lotNumber = value;
            qrType = "WO";
            break;
        }

        if (/^RC([-_]|$)/i.test(value)) {
            lotNumber = value;
            qrType = "RC";
            break;
        }
    }

    if (!lotNumber) {
        Swal.fire({
            icon: 'warning',
            title: 'ไม่พบ WO / WO2 / RC',
            text: 'ไม่พบหมายเลข WO, WO2 หรือ RC ใน QR Code นี้',
            confirmButtonText: 'สแกนใหม่'
        }).then(() => {
            scanLocked = false;
            initScanner();
        });
        return;
    }

    // ==========================================
    // BASIC QR DATA
    // ==========================================

    currentScanData.lotNumber = lotNumber;
    currentScanData.partNumber = parts[0] || '';

    // ==========================================
    // QR QTY
    // WO / WO2 = ช่องที่ 2
    // RC       = ช่องที่ 5
    // ==========================================

    if (qrType === 'RC') {
        currentScanData.qrQty = parts[4] || '';
    } else {
        currentScanData.qrQty = parts[1] || '';
    }

    currentScanData.unit = parts[2] || '';
    currentScanData.serialNumber = parts[parts.length - 1] || '';
    currentScanData.unit2 = '';

    // ==========================================
    // DISPLAY BASIC DATA
    // ==========================================

    document.getElementById('display-lot').textContent = lotNumber;
    document.getElementById('display-part').textContent =
        currentScanData.partNumber;

    const rcUnitDisplay =
        document.getElementById('rc-unit-display');

    const unit2Container =
        document.getElementById('unit2-container');

    // ==========================================
    // RC
    // ==========================================

    if (qrType === 'RC') {

        rcUnitDisplay.classList.remove('hidden');
        unit2Container.classList.remove('hidden');

        document.getElementById('display-unit').textContent =
            'กำลังโหลด...';

        // แสดงหน้า Input ทันที
        // ไม่ต้องรอ API
        showView('view-input');

        setTimeout(() => {
            document.getElementById('actual-qty').focus();
        }, 300);

        // โหลด Unit เบื้องหลัง
        fetch(WEB_APP_URL, {
            method: 'POST',
            body: new URLSearchParams({
                data: JSON.stringify({
                    action: 'getPartUnit',
                    partNumber: currentScanData.partNumber
                })
            })
        })
        .then(response => response.json())
        .then(resJson => {

            if (resJson.status === 'success') {

                currentScanData.unit =
                    resJson.unit || '-';

                document.getElementById('display-unit').textContent =
                    currentScanData.unit;

            } else {

                document.getElementById('display-unit').textContent =
                    'ไม่พบ Unit';
            }
        })
        .catch(error => {

            console.error(
                'GET PART UNIT ERROR:',
                error
            );

            document.getElementById('display-unit').textContent =
                'เชื่อมต่อผิดพลาด';
        });

        return;
    }

    // ==========================================
    // WO / WO2
    // ==========================================

    rcUnitDisplay.classList.add('hidden');
    unit2Container.classList.add('hidden');

    showView('view-input');

    setTimeout(() => {
        document.getElementById('actual-qty').focus();
    }, 300);
}

        async function cancelInput() {
            document.getElementById('actual-qty').value = '';
            const unit2Select = document.getElementById('unit2-select');
            if (unit2Select) unit2Select.value = '';
            currentScanData.unit2 = '';
            await stopZXingScanner();
            showView('view-scanner');
            initScanner();
        }

        async function submitCount() {
            const actualQty = document.getElementById('actual-qty').value.trim();
            const unit2Select = document.getElementById('unit2-select');
            const unit2 = unit2Select ? unit2Select.value : '';

            if (!actualQty) {
                Swal.fire({ icon: 'warning', title: 'กรุณากรอกจำนวน', text: 'โปรดระบุจำนวนที่ตรวจนับได้จริง', confirmButtonColor: '#3085d6' });
                return;
            }

            if (/^RC/i.test(currentScanData.lotNumber) && !unit2) {
                Swal.fire({ icon: 'warning', title: 'กรุณาเลือก Unit2', text: 'สำหรับรายการ RC จำเป็นต้องระบุ Unit2 ก่อนบันทึกข้อมูล', confirmButtonColor: '#3085d6' });
                return;
            }

            currentScanData.actualQty = actualQty;
            currentScanData.unit2 = unit2;

            const payload = {
                zone: currentSession.zone,
                location: currentSession.location,
                responsiblePerson: currentSession.responsiblePerson,
                partNumber: currentScanData.partNumber,
                qrQty: currentScanData.qrQty,
                unit: currentScanData.unit,
                lotNumber: currentScanData.lotNumber,
                serialNumber: currentScanData.serialNumber,
                actualQty: currentScanData.actualQty,
                unit2: currentScanData.unit2
            };

            const loadingOverlay = document.getElementById('loading-overlay');
            loadingOverlay.classList.remove('hidden');

            try {
                const response = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    body: new URLSearchParams({
                        data: JSON.stringify(payload)
                    })
                });

                const result = await response.json();
                loadingOverlay.classList.add('hidden');

                if (result.status === 'success') {
                    Swal.fire({
                        icon: 'success',
                        title: 'บันทึกสำเร็จ',
                        text: result.message || 'บันทึกข้อมูลเรียบร้อยแล้ว',
                        timer: 1500,
                        showConfirmButton: false
                    }).then(() => {
                        document.getElementById('actual-qty').value = '';
                        if (unit2Select) unit2Select.value = '';
                        showView('view-scanner');
                        initScanner();
                    });
                } else {
                    Swal.fire({ icon: 'error', title: 'เกิดข้อผิดพลาด', text: result.message || 'ไม่สามารถบันทึกข้อมูลได้' });
                }
            } catch (error) {
                loadingOverlay.classList.add('hidden');
                Swal.fire({ icon: 'error', title: 'เชื่อมต่อล้มเหลว', text: error.toString() });
            }
        }
    </script>
